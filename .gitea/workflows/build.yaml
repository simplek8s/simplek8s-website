name: Build with Hugo and publish Container
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  reqs:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
  test:
    runs-on: ubuntu-latest
    needs: reqs
    if: success() && gitea.ref != 'refs/heads/main'
    steps:
      -
        name: Build
        uses: docker/build-push-action@v4
        env:
          ACTIONS_RUNTIME_TOKEN: ''
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: |
            registry.jlsalvador.online/simplek8s/website:latest
  publish:
    runs-on: ubuntu-latest
    needs: reqs
    if: success() && gitea.ref == 'refs/heads/main'
    steps:
      -
        name: Login to registry.jlsalvador.online
        uses: docker/login-action@v2
        with:
          registry: registry.jlsalvador.online
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      -
        name: Build and push
        uses: docker/build-push-action@v4
        env:
          ACTIONS_RUNTIME_TOKEN: ''
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            registry.jlsalvador.online/simplek8s/website:latest
      -
        name: Webhook Keel
        uses: https://github.com/joelwmale/webhook-action@master
        with:
          url: ${{ secrets.KEEL_WEBHOOK_URL }}
          body: '{"name":"registry.jlsalvador.online/simplek8s/website","tag":"latest"}'
