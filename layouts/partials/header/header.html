<div class="container">
  <header class="d-flex justify-content-end flex-wrap align-items-center py-3">
    <ul class="nav nav-underline">
      {{- $current := . -}}
      {{ range (sort .Site.Menus.main "Weight" "desc") -}}
        {{- $active := and (eq $current.RelPermalink "/") (eq .URL "/") -}}
        {{- $active = or $active (and (ne .URL "/") (hasPrefix $current.RelPermalink .URL)) -}}
        <li class="nav-item">
          <a href="{{ .URL | relURL }}" class="nav-link{{ if $active }} active{{ end }}" aria-current="page">
            {{ .Name }}
          </a>
        </li>
      {{ end -}}
    </ul>
  </header>
</div>
